<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 32×32 pixel cairn — stacked stones + amber play -->
  <rect width="32" height="32" rx="6" fill="#1c1916"/>
  <!-- top stone -->
  <rect x="7" y="5" width="18" height="5" fill="#efe8de"/>
  <rect x="8" y="4" width="16" height="1" fill="#efe8de"/>
  <rect x="8" y="10" width="16" height="1" fill="#efe8de"/>
  <!-- mid stone -->
  <rect x="6" y="13" width="14" height="5" fill="#efe8de"/>
  <rect x="7" y="12" width="12" height="1" fill="#efe8de"/>
  <rect x="7" y="18" width="12" height="1" fill="#efe8de"/>
  <!-- base stone -->
  <rect x="5" y="21" width="18" height="5" fill="#efe8de"/>
  <rect x="6" y="20" width="16" height="1" fill="#efe8de"/>
  <rect x="6" y="26" width="16" height="1" fill="#efe8de"/>
  <!-- play -->
  <rect x="22" y="13" width="2" height="6" fill="#e8a33d"/>
  <rect x="24" y="14" width="2" height="4" fill="#e8a33d"/>
  <rect x="26" y="15" width="2" height="2" fill="#e8a33d"/>
</svg>
