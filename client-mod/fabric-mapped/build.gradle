plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}
group = 'app.cairn'
version = '0.1.0'
def targetMinecraft = findProperty('minecraftVersion') ?: '1.21.1'
if (!['1.20.1', '1.21.1'].contains(targetMinecraft)) throw new GradleException("Unsupported mapped Fabric target: $targetMinecraft")
base { archivesName = "cairn-client-fabric-$targetMinecraft" }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.release = targetMinecraft == '1.20.1' ? 17 : 21 }
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir("src/$targetMinecraft/java")
unimined.minecraft {
    version targetMinecraft
    mappings { mojmap() }
    fabric { loader '0.20.1' }
}
processResources {
    inputs.property 'minecraftVersion', targetMinecraft
    filesMatching('fabric.mod.json') { expand minecraftVersion: targetMinecraft, javaVersion: targetMinecraft == '1.20.1' ? '17' : '21' }
}
