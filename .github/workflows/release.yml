name: Release

# Builds installable desktop apps and publishes GitHub Releases + R2 updater.
# Runs on every push to main — no manual tags. Tags are created as vX.Y.Z-build.N.
#
# Secrets needed:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPDATER_DOWNLOAD_BASE_URL: https://pub-f68c946cc3b343619b3faea90c762d28.r2.dev
  R2_BUCKET: cairn-updates
  R2_ENDPOINT: https://f92074baafe52a6a6b5b47c82488090d.r2.cloudflarestorage.com

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.resolve.outputs.base }}
      build: ${{ steps.resolve.outputs.build }}
      stamped: ${{ steps.resolve.outputs.stamped }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve per-base build number
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/resolve-release-build.mjs

  build-windows:
    needs: [version]
    runs-on: windows-2025
    env:
      UPDATER_ARTIFACT_PREFIX: builds/${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-windows
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Stamp release version
        shell: bash
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Cairn (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CAIRN_CURSEFORGE_API_KEY: ${{ secrets.CAIRN_CURSEFORGE_API_KEY }}
        run: npm run build:ci

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        shell: bash
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            src-tauri/target/release/bundle \
            windows-x86_64 \
            src-tauri/target/release/bundle/latest-fragment.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/latest-fragment.json

  build-linux:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform_key: linux-x86_64
            artifact_name: linux-x64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            platform_key: linux-aarch64
            artifact_name: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      UPDATER_ARTIFACT_PREFIX: builds/${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.platform_key }}
          cache-on-failure: true

      - name: Verify native build architecture
        env:
          EXPECTED_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Cairn (deb + rpm + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CAIRN_CURSEFORGE_API_KEY: ${{ secrets.CAIRN_CURSEFORGE_API_KEY }}
        run: npm run build:linux:ci

      - name: Sign Linux package updaters
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for pkg in \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/deb/*.deb
          do
            if [ ! -f "${pkg}.sig" ]; then
              echo "Signing $pkg"
              npx tauri signer sign "$pkg"
            else
              echo "Already signed: $pkg"
            fi
          done

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        run: |
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            src-tauri/target/release/bundle \
            "${{ matrix.platform_key }}" \
            src-tauri/target/release/bundle/latest-fragment.json

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/latest-fragment.json

  build-macos:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            platform_key: darwin-aarch64
            artifact_name: macos-arm64
          - rust_target: x86_64-apple-darwin
            platform_key: darwin-x86_64
            artifact_name: macos-x64
    runs-on: macos-15
    env:
      UPDATER_ARTIFACT_PREFIX: builds/${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08
        with:
          targets: ${{ matrix.rust_target }}

      - name: Configure macOS deployment target
        id: macos
        run: |
          MACOS_TARGET=$(node -p "require('./src-tauri/tauri.conf.json').bundle.macOS.minimumSystemVersion")
          printf 'MACOSX_DEPLOYMENT_TARGET=%s\nCMAKE_OSX_DEPLOYMENT_TARGET=%s\n' "$MACOS_TARGET" "$MACOS_TARGET" >> "$GITHUB_ENV"
          printf 'deployment_target=%s\n' "$MACOS_TARGET" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-macos-${{ matrix.rust_target }}-${{ steps.macos.outputs.deployment_target }}
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Build Cairn (macOS .app)
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CAIRN_CURSEFORGE_API_KEY: ${{ secrets.CAIRN_CURSEFORGE_API_KEY }}
        run: npm run build:macos:ci -- --target ${{ matrix.rust_target }}

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ARCH_SUFFIX="${{ matrix.rust_target }}"
          ARCH_SUFFIX="${ARCH_SUFFIX/-apple-darwin/}"
          echo "arch_suffix=$ARCH_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$BUNDLE/macos" ]; then
            BUNDLE="src-tauri/target/release/bundle"
          fi
          APP="$BUNDLE/macos/Cairn.app"
          DMG_DIR="$BUNDLE/dmg"
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/Cairn_${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.arch_suffix }}.dmg"
          chmod +x .github/create-macos-dmg.sh
          .github/create-macos-dmg.sh "$APP" "$DMG" "Cairn"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Write updater fragment
        id: fragment
        run: |
          BUNDLE="${{ steps.dmg.outputs.bundle_dir }}"
          node .github/write-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            "$BUNDLE" \
            ${{ matrix.platform_key }} \
            "$BUNDLE/latest-fragment.json"
          echo "bundle_dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ steps.fragment.outputs.bundle_dir }}/dmg/*.dmg
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.app.tar.gz
            ${{ steps.fragment.outputs.bundle_dir }}/macos/*.sig
            ${{ steps.fragment.outputs.bundle_dir }}/latest-fragment.json

  publish:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Stamp release version
        run: node .github/stamp-release-version.mjs "${{ needs.version.outputs.build }}"

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ needs.version.outputs.build }}" >> "$GITHUB_OUTPUT"

      - name: Merge updater manifest
        run: |
          node .github/merge-latest-json.mjs \
            "${{ steps.meta.outputs.version }}" \
            artifacts \
            artifacts/latest.json
          cat artifacts/latest.json

      - name: Prepare release files
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          PREFIX="builds/${TAG}"
          mkdir -p "release-r2/${PREFIX}" release-gh
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \
          \) -exec cp -n {} "release-r2/${PREFIX}/" \;
          cp artifacts/latest.json release-r2/latest.json
          mkdir -p release-r2/beta
          cp artifacts/latest.json release-r2/beta/latest.json
          # Kept next to the files so promote-stable.yml can re-publish this exact build.
          cp artifacts/latest.json "release-r2/${PREFIX}/latest.json"
          cp -n "release-r2/${PREFIX}/"* release-gh/ 2>/dev/null || true
          cp release-r2/latest.json release-gh/latest.json
          echo "R2 layout:"
          find release-r2 -type f | sort
          echo "GH assets:"
          ls -la release-gh

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          LIVE_BUILD_PREFIX: builds/${{ needs.version.outputs.tag }}
          # Unset or anything but 'true': every main build goes to both channels (the
          # original behavior). 'true': main builds go to beta only, and stable moves
          # when a vX.Y.Z tag runs promote-stable.yml.
          STABLE_FROM_TAGS: ${{ vars.CAIRN_STABLE_FROM_TAGS }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets missing; skip R2 upload."
            exit 1
          fi
          aws s3 sync "release-r2/${LIVE_BUILD_PREFIX}/" "s3://${R2_BUCKET}/${LIVE_BUILD_PREFIX}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors
          aws s3 cp release-r2/beta/latest.json "s3://${R2_BUCKET}/beta/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=60"
          echo "Published ${UPDATER_DOWNLOAD_BASE_URL}/beta/latest.json"
          if [ "$STABLE_FROM_TAGS" = "true" ]; then
            echo "Stable channel left as is; push a vX.Y.Z tag to promote this build."
          else
            aws s3 cp release-r2/latest.json "s3://${R2_BUCKET}/latest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json \
              --cache-control "public, max-age=60"
            echo "Published ${UPDATER_DOWNLOAD_BASE_URL}/latest.json"
          fi
          node .github/cleanup-r2.mjs
          echo "Artifacts under ${UPDATER_DOWNLOAD_BASE_URL}/${LIVE_BUILD_PREFIX}/"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Cairn v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.build }})
          generate_release_notes: true
          files: release-gh/*
          draft: false
          prerelease: ${{ vars.CAIRN_STABLE_FROM_TAGS == 'true' }}
