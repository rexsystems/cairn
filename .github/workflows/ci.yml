name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Full installers ship from Release on main. PR builds keep the matrix light.
  build:
    name: Build (${{ matrix.name }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - name: windows-x64
            platform: windows-latest
            args: --bundles nsis
          - name: macos-arm64
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macos-x64
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08
        with:
          targets: ${{ matrix.rust_target || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle
            src-tauri/target/*/release/bundle
          if-no-files-found: warn
          retention-days: 14

  # Fedora has newer GTK/WebKit than Ubuntu 22.04 and is where rpm users are.
  # Builds the rpm and installs it so missing package dependencies show up here.
  fedora:
    name: Fedora (rpm)
    needs: check
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: Install build deps
        run: |
          dnf install -y git gcc gcc-c++ make curl wget file nodejs npm rpm-build \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel \
            libxdo-devel

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: fedora
          cache-on-failure: true

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build rpm
        run: npx tauri build --bundles rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Install the rpm
        run: |
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm | head -n1)
          rpm -qpR "$RPM"
          dnf install -y "$RPM"
          test -x /usr/bin/cairn
          ldd /usr/bin/cairn | (! grep 'not found')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-fedora-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 14

  flatpak:
    name: Flatpak
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            flatpak flatpak-builder appstream desktop-file-utils

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2025-08

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: flatpak
          cache-on-failure: true

      - run: npm ci

      - name: Validate desktop entry and metainfo
        run: |
          desktop-file-validate flatpak/app.cairn.launcher.desktop
          appstreamcli validate --no-net flatpak/app.cairn.launcher.metainfo.xml

      - name: Build deb
        run: npx tauri build --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Flatpak bundle
        run: |
          cp src-tauri/target/release/bundle/deb/*.deb flatpak/cairn.deb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=flatpak-repo \
            build-flatpak flatpak/app.cairn.launcher.yml
          flatpak build-bundle flatpak-repo cairn.flatpak app.cairn.launcher \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-flatpak
          path: cairn.flatpak
          retention-days: 14
