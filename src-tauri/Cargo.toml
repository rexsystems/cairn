[package]
name = "cairn"
version = "0.1.0"
description = "Cairn Minecraft launcher"
authors = ["rexsystems"]
repository = "https://github.com/rexsystems/cairn"
homepage = "https://github.com/rexsystems/cairn"
license = "AGPL-3.0-or-later"
edition = "2021"
default-run = "cairn"

[lib]
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
flate2 = "1"
tar = "0.4"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
urlencoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
fastnbt = "2"
discord-rich-presence = "0.2"
sentry = "0.49.3"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
opt-level = "s"
